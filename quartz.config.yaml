# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Kenshi Modding Wiki
  pageTitleSuffix: " | Kenshi Modding Wiki"
  enableSPA: true
  enablePopovers: true
  prefetch: hover
  analytics: null
  locale: en-US
  baseUrl: atlasroar.github.io/Kenshi-Modding-Wiki
  publishAssets: referenced
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Georgia
      body: Segoe UI
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#e9e1d2"
        lightgray: "#c5b69d"
        gray: "#776750"
        darkgray: "#483f32"
        dark: "#292b24"
        secondary: "#854023"
        tertiary: "#46604a"
        highlight: "#8540230d"
        textHighlight: "#c89b4355"
      darkMode:
        light: "#20231f"
        lightgray: "#4b5042"
        gray: "#b4a78e"
        darkgray: "#ddd3bf"
        dark: "#f3ead6"
        secondary: "#e4ad78"
        tertiary: "#aec19b"
        highlight: "#e4ad7812"
        textHighlight: "#c89b4344"
  links:
    markdownLinkResolution: absolute
  contentIndex:
    enableSiteMap: true
    enableRSS: false
plugins:
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      strictLineBreaks: true
      enableInHtmlEmbed: false
    order: 40
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: false
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: beforeBody
      priority: 0
  - source: "@quartz-community/graph"
    enabled: true
    options:
      localGraph:
        showTags: false
        depth: 1
      globalGraph:
        showTags: false
    layout:
      position: right
      priority: 0
  - source: "@quartz-community/og-image"
    enabled: true
    options:
      colorScheme: darkMode
      width: 1200
      height: 630
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 20
  - source: "@quartz-community/footer"
    enabled: false
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      template: default
      positions:
        beforeBody: []
