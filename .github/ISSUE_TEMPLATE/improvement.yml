name: Feature or site improvement
description: Suggest website features, navigation, accessibility, or maintenance improvements.
title: "[Improvement] "
body:
  - type: markdown
    attributes:
      value: |
        Use the dedicated forms for Site error, Correction, New page submission or
        request, and Media submission. General modding questions belong in Discussions.

        Keep reports public-safe. Do not paste private notes, credentials,
        personal data, or signed/private URLs. Website setup, CSS, and contribution
        documentation belong in the GitHub Wiki, not public guide pages.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Website feature or integration
        - Navigation or search
        - Theme, layout, or readability
        - Accessibility or keyboard use
        - Contribution or review workflow
        - Build, deployment, or repository maintenance
        - Technical Wiki organization
        - Another improvement
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or topic
      description: Include the page URL if the issue concerns an existing article.
  - type: textarea
    id: improvement
    attributes:
      label: Problem or unmet need
      description: Explain who is affected and why the current behavior or workflow is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the desired outcome and how a maintainer could tell it is working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives, examples, and tradeoffs
      description: Include useful examples, simpler alternatives, or likely maintenance and accessibility costs.
